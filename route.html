<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>路線紀錄</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<svg class="topo-bg" xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" preserveAspectRatio="none">
  <defs>
    <pattern id="topo" width="420" height="420" patternUnits="userSpaceOnUse">
      <g fill="none" stroke="#56635a" stroke-width="1">
        <path d="M-20 40 Q 90 -10, 200 40 T 440 40" />
        <path d="M-20 90 Q 90 40, 200 90 T 440 90" />
        <path d="M-20 140 Q 90 90, 200 140 T 440 140" />
        <path d="M-20 200 Q 110 260, 220 200 T 460 200" />
        <path d="M-20 250 Q 110 310, 220 250 T 460 250" />
        <path d="M-20 300 Q 110 360, 220 300 T 460 300" />
        <path d="M-40 360 Q 80 400, 200 360 T 440 360" />
      </g>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#topo)" />
</svg>

<div class="page">
  <a class="back-link" href="index.html">‹ 返回路線列表</a>

  <div id="content">
    <p style="font-family:'Lihsianti Mono','IBM Plex Mono',monospace; color:var(--ink-faint);">找不到這條路線。</p>
  </div>

  <footer class="note">溯溪紀錄本</footer>
</div>

<script src="js/routes-data.js"></script>
<script>
  const params = new URLSearchParams(location.search);
  const slug = params.get("r");
  const route = getRoute(slug);
  const content = document.getElementById("content");

  // 選第幾次的 trip，網址可以帶 &t=2 直接跳到第二次；預設顯示最新一次
  let tripIndex = route ? route.trips.length - 1 : 0;
  const requestedTrip = parseInt(params.get("t"), 10);
  if (route && requestedTrip >= 1 && requestedTrip <= route.trips.length) {
    tripIndex = requestedTrip - 1;
  }

  function escapeHtml(str) {
    return String(str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;");
  }

  function renderTrip() {
    const trip = route.trips[tripIndex];
    const idx = ROUTES.indexOf(route);
    const no = String(idx + 1).padStart(2, "0");
    const tripFolder = `images/${route.slug}/trip${tripIndex + 1}`;

    // ---- 多次造訪的分頁切換 ----
    let tabsHtml = "";
    if (route.trips.length > 1) {
      tabsHtml = `<div class="trip-tabs">` + route.trips.map((t, i) => {
        const label = t.date ? `第 ${i + 1} 次 · ${t.date}` : `第 ${i + 1} 次`;
        const active = i === tripIndex ? "active" : "";
        return `<button class="trip-tab ${active}" data-trip="${i}">${label}</button>`;
      }).join("") + `</div>`;
    }

    // ---- 合照 ----
    const groupPhotoBlock = trip.groupPhoto
      ? `<figure class="group-photo"><img src="${tripFolder}/${trip.groupPhoto}" alt="${route.name} 人員合照"></figure>`
      : `<div class="placeholder-box group-photo-placeholder">尚無人員合照<br>將照片放入 ${tripFolder}/group-photo.jpg 後於 routes-data.js 把這次 trip 的 groupPhoto 填成 "group-photo.jpg"</div>`;

    // ---- 資訊列 ----
    const dateChip = trip.date
      ? `<div class="info-chip"><span class="k">時間</span>${trip.date}</div>`
      : `<div class="info-chip empty"><span class="k">時間</span>尚無紀錄</div>`;

    const diffChip = trip.difficulty
      ? `<div class="info-chip"><span class="k">難度</span>${trip.difficulty}</div>`
      : "";

    const startPointChip = trip.startPoint
      ? `<a class="info-chip" href="${trip.startPoint}" target="_blank" rel="noopener"><span class="k">起溯點</span>開啟地圖 ↗</a>`
      : "";

    // ---- 人員 ----
    const membersBlock = (trip.members && trip.members.length)
      ? `<div class="members-list">${trip.members.map(m => `<span>${m}</span>`).join("")}</div>`
      : `<div class="placeholder-box">尚無人員紀錄</div>`;

    const supportBlock = (trip.support && trip.support.length)
      ? `<div class="support-row"><span class="support-label">留守</span><div class="members-list">${trip.support.map(m => `<span>${m}</span>`).join("")}</div></div>`
      : "";

    // ---- 溯行圖 ----
    const mapBlock = trip.mapImage
      ? `<div class="map-frame"><img src="${tripFolder}/${trip.mapImage}" alt="${route.name} 溯行圖"></div>`
      : `<div class="placeholder-box">尚無溯行圖<br>將圖片放入 ${tripFolder}/route-map.jpg 後於 routes-data.js 把這次 trip 的 mapImage 填成 "route-map.jpg"</div>`;

    // ---- 紀錄（文字＋照片混排，連續的照片會排成一列一列，不會一張一張拖很長） ----
    let entriesBlock = "";
    if (trip.entries && trip.entries.length) {
      const blocks = [];
      let photoRun = [];

      const flushPhotoRun = () => {
        if (!photoRun.length) return;
        const cols = Math.min(photoRun.length, 3);
        const figuresHtml = photoRun.map((e, i) => {
          const rotClass = i % 3 === 0 ? "rot-a" : (i % 3 === 1 ? "rot-b" : "rot-c");
          const caption = e.caption ? `<figcaption>${escapeHtml(e.caption)}</figcaption>` : "";
          return `<figure class="grid-photo ${rotClass}"><img src="${tripFolder}/photos/${e.src}" alt="${route.name}">${caption}</figure>`;
        }).join("");
        blocks.push(`<div class="entry-photo-grid" style="--cols: ${cols};">${figuresHtml}</div>`);
        photoRun = [];
      };

      trip.entries.forEach(e => {
        if (e.type === "photo") {
          photoRun.push(e);
        } else {
          flushPhotoRun();
          blocks.push(`<p class="entry-text">${escapeHtml(e.text).replace(/\n/g, "<br>")}</p>`);
        }
      });
      flushPhotoRun();

      entriesBlock = `<div class="entry-flow">${blocks.join("")}</div>`;
    } else {
      entriesBlock = `<div class="placeholder-box">尚無文字紀錄或照片</div>`;
    }

    // ---- GPX ----
    const gpxBlock = trip.gpx
      ? `<a class="gpx-download" href="${tripFolder}/${trip.gpx}" download>⬇ 下載 GPX 軌跡（${trip.gpx}）</a>`
      : `<div class="placeholder-box">尚無 GPX 檔<br>將檔案放入 ${tripFolder}/track.gpx 後於 routes-data.js 把這次 trip 的 gpx 填成 "track.gpx"</div>`;

    content.innerHTML = `
      ${groupPhotoBlock}

      <div class="route-head">
        <div class="route-no">NO. ${no}</div>
        <h1>${route.name}</h1>
      </div>

      ${tabsHtml}

      <div class="info-strip">
        ${dateChip}
        ${diffChip}
        ${startPointChip}
      </div>

      <section class="block">
        <h3>人員</h3>
        ${membersBlock}
        ${supportBlock}
      </section>

      <section class="block">
        <h3>溯行圖</h3>
        ${mapBlock}
      </section>

      <section class="block">
        <h3>紀錄</h3>
        ${entriesBlock}
      </section>

      <section class="block">
        <h3>GPX 軌跡下載</h3>
        ${gpxBlock}
      </section>
    `;

    if (route.trips.length > 1) {
      document.querySelectorAll(".trip-tab").forEach(btn => {
        btn.addEventListener("click", () => {
          tripIndex = parseInt(btn.dataset.trip, 10);
          renderTrip();
          window.scrollTo({ top: 0, behavior: "smooth" });
        });
      });
    }
  }

  if (route) {
    document.title = route.name + " · 溯溪紀錄";
    renderTrip();
  }
</script>

</body>
</html>
